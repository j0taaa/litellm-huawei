name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/j0taaa/litellm-huawei

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run UI tests and build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish LiteLLM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: litellm.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-litellm:latest
            ${{ env.IMAGE_PREFIX }}-litellm:${{ github.sha }}

      - name: Build and publish tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-tools:latest
            ${{ env.IMAGE_PREFIX }}-tools:${{ github.sha }}

      - name: Build and publish UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ui:latest
            ${{ env.IMAGE_PREFIX }}-ui:${{ github.sha }}
